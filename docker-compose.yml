services:
  web:
    build: .
    image: rare-disease-reconcile:latest
    container_name: rare-disease-reconcile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_DB_PATH: /data/app.db
    volumes:
      # 命名卷持久化底表与批次；容器重启/重建后仍可对账。
      - reconcile-data:/data
    restart: unless-stopped

volumes:
  reconcile-data:
